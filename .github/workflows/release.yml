name: Release

on:
  push:
    tags:
      # Calendar versions: YEAR.MONTH.N, for example 2026.10.0
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the tag matches the card version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG_NAME is not a calendar version (YEAR.MONTH.N, for example 2026.10.0)"
            exit 1
          fi
          CARD_VERSION=$(sed -nE "s/^const CARD_VERSION = '([^']+)';/\1/p" lovelace-rehoboam.js)
          if [ "$CARD_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match CARD_VERSION $CARD_VERSION in lovelace-rehoboam.js"
            exit 1
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" lovelace-rehoboam.js \
            --title "$TAG_NAME" \
            --generate-notes
