name: HACS Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate HACS repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
          ignore: "description topics images"

  readme:
    runs-on: ubuntu-latest
    name: README option tables match the settings list
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README option tables
        run: node scripts/readme-options.mjs --check
