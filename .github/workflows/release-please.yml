name: Release

# Calendar versions YEAR.MONTH.N. release-please bumps N (always-bump-patch); at the start of a
# month the first step pins YEAR.MONTH.0 with a "Release-As" commit, because release-please has
# no calendar versioning of its own.
on:
  push:
    branches:
      - main
  schedule:
    # The first of each month, so an open release PR moves to the new month
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start a new month at YEAR.MONTH.0
        run: |
          current=$(jq -r '."."' .release-please-manifest.json)
          month=$(date -u +%Y.%-m)
          if [[ "$current" == "$month".* ]]; then
            echo "Last release $current is in $month; release-please bumps the last number."
            exit 0
          fi
          next="$month.0"
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if git log --format=%B ${last_tag:+"$last_tag"..}HEAD | grep -qx "Release-As: $next"; then
            echo "Release-As $next is already set."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: start release $next" -m "Release-As: $next"
          git push origin HEAD:main

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Attach the card to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" lovelace-rehoboam.js --clobber
