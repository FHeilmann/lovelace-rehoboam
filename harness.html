<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehoboam Card Playground</title>
<meta name="description" content="Try the Rehoboam Lovelace card in the browser and generate a YAML config for it.">
<style>
:root{--bg:#0d0d11;--panel:#18181e;--line:#2c2c35;--text:#dcdce2;--muted:#9696a2;--accent:#7fb8ff;--field:#0f0f14;--on:#3d6fb0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font:13px/1.4 system-ui,-apple-system,sans-serif;color:var(--text);display:flex;flex-direction:column}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:10px 14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
header .ver{color:var(--muted);font-variant-numeric:tabular-nums}
header nav{margin-left:auto;display:flex;gap:14px}
header select{padding:3px 6px;background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit}
header button{padding:3px 9px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:4px;cursor:pointer}
main{flex:1;display:flex;min-height:0}
#cells{flex:1;min-width:0;position:relative;overflow:hidden}
#cells.single .cell{display:none}
#cells.single .cell.sel{display:block;width:100%;height:100%}
#cells.grid{display:grid;grid-template-columns:640px 640px;overflow:auto}
#cells.grid .cell{width:640px;height:353px;overflow:hidden}
#panel{width:350px;flex:none;overflow-y:auto;padding:4px 14px 14px;background:var(--panel);border-left:1px solid var(--line)}
body.nopanel #panel{display:none}
#panel h3{margin:18px 0 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.intro{margin:10px 0 0;color:var(--muted)}
.row{margin:8px 0}
.row>label,.check{display:flex;align-items:center;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;margin-top:3px}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row.unset input[type=range]{opacity:.4}
input[type=number],input[type=text],select{padding:4px 6px;background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;min-width:0}
.ctl input[type=number]{width:78px;flex:none}
.row>input[type=text],.row>select,.row>.ctl>select{width:100%}
.ctl select{flex:1}
.ctl input[type=text]{flex:1.4}
.check{gap:6px;margin:8px 0;cursor:pointer}
.seg{display:flex;gap:4px;margin:6px 0}
.seg button,.btn{flex:1;min-width:0;min-height:32px;padding:6px 6px;border:1px solid var(--line);background:#25252d;color:var(--text);border-radius:5px;cursor:pointer;font:500 12px/1.2 system-ui,-apple-system,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,border-color .15s}
.seg button:hover,.btn:hover{background:#30303a;border-color:#45454f}
.seg button.on,.btn.primary{background:var(--on);border-color:#5a8fd8;color:#fff}
.seg button.on:hover,.btn.primary:hover{background:#4779bd;border-color:#6a9ce0}
.btn.ghost{background:transparent}
.btn.done,.btn.done:hover{background:#2e5d3a;border-color:#4a8a5a;color:#fff}
.btn.add{display:block;width:100%;margin:8px 0 4px;border-style:dashed;background:transparent;color:var(--accent)}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.sim>span{flex:0 0 100%;color:var(--muted)}
.maprow{margin:4px 0 6px}
.maprow input[type=text]{flex:0 0 33%;min-width:0}
.maprow input[type=number]{width:54px}
.maprow .btn.danger{min-height:28px;padding:2px 9px}
.btn.danger{flex:none;color:#ff8a80;border-color:#5a3030;background:transparent}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
details.ent{margin:8px 0;padding:2px 10px 6px;border:1px solid var(--line);border-radius:6px;background:#1e1e25}
details.ent>summary{cursor:pointer;padding:6px 0;display:flex;gap:8px;align-items:center}
details.ent>summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row,.check{position:relative}
.tip{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;border-radius:50%;border:1px solid currentColor;font:italic 600 10px/1 Georgia,serif;cursor:help;flex:none;outline:none}
.tip:hover,.tip:focus{color:var(--accent)}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;right:0;top:22px;z-index:20;padding:8px 10px;border-radius:6px;background:#2a2a33;color:var(--text);border:1px solid #3a3a46;box-shadow:0 4px 14px rgba(0,0,0,.45);font:400 12px/1.4 system-ui,sans-serif;white-space:normal;pointer-events:none}
#yaml{margin:6px 0;padding:8px;max-height:320px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:4px;font:12px/1.45 ui-monospace,monospace;white-space:pre;color:#cfe3ff}
.actions{position:sticky;bottom:-14px;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px -14px 0;padding:10px 14px 14px;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 14px -10px rgba(0,0,0,.7)}
.stats{white-space:pre;padding:6px;background:var(--field);border-radius:4px;font:11px ui-monospace,monospace;color:#9f9}
#toast{position:fixed;left:14px;bottom:14px;z-index:30;max-width:min(420px,calc(100vw - 28px));padding:8px 12px;border-radius:6px;background:#2a2a33;border:1px solid #3a3a46;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:820px){
  body{height:auto;display:block}
  main{display:block}
  #cells.single .cell.sel{height:min(100vw,72vh)}
  #cells{height:auto}
  #panel{width:auto;border-left:none;border-top:1px solid var(--line);overflow:visible;padding:4px 16px 16px}
  .actions{bottom:0;margin:12px -16px 0;padding:10px 16px 14px}
  header nav{margin-left:0}
}
</style>
</head><body>
<header>
  <h1>Rehoboam Card</h1><span class="ver" id="ver"></span>
  <nav>
    <a href="https://github.com/FHeilmann/lovelace-rehoboam">GitHub</a>
    <a href="https://github.com/FHeilmann/lovelace-rehoboam#installation" id="install-link">Install</a>
    <select id="lang" aria-label="Language"></select>
    <button id="toggle" type="button">Hide panel</button>
  </nav>
</header>
<main>
  <div id="cells"><div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div><div class="cell" id="c3"></div></div>
  <aside id="panel"></aside>
</main>
<div id="toast" role="status"></div>
<script>
// Playground for the Rehoboam card without Home Assistant: change the settings, simulate sensor
// values, and copy the YAML config. Locally: serve this folder over HTTP (python3 -m http.server)
// and open harness.html.
// URL options: #cfg=<base64 JSON> (share link), v=<script name without .js>, grid=1 (4 presets),
// one=0..3 (preset), panel=0
const q = new URLSearchParams(location.search);
const scriptName = q.get('v') || 'lovelace-rehoboam';
const grid = q.get('grid') === '1';
const one = grid ? null : q.get('one');
if (q.get('panel') === '0') document.body.classList.add('nopanel');

const PRESETS = [
  { theme_mode: 'dark', test_divergence: 0 },
  { theme_mode: 'light', test_divergence: 0 },
  { theme_mode: 'dark', test_divergence: 1, eclipse_angle: 180 },
  { theme_mode: 'light', test_divergence: 1, eclipse_angle: 180 },
];
// Example sensors. `_div` is the simulated value (0 = baseline, 1 = critical); it never goes into the YAML.
const DEMO_ENTS = [
  { entity: 'sensor.pm25', name: 'PM2.5', category: 'AIR QUALITY', baseline: 5, critical: 60, unit: 'µg/m³', angle: 180, monitoring_threshold: 15, divergence_threshold: 35, _div: 0.85 },
  { entity: 'sensor.temperature', name: 'Temperature', category: 'THERMAL VARIANCE', baseline: 20, critical: 35, unit: '°C', angle: 50, _div: 0.53 },
  { entity: 'sensor.humidity', name: 'Humidity', category: 'HUMIDITY', baseline: 40, critical: 80, unit: '%', angle: 20, _div: 0.45 },
  { entity: 'sensor.commute', name: 'Commute', category: 'COMMUTE', baseline: 20, critical: 90, unit: 'min', angle: 335, monitoring_threshold: 40, divergence_threshold: 60, always_visible: true, _div: 0.36 },
  { entity: 'sensor.battery', name: 'Battery', category: 'BATTERY', baseline: 100, critical: 20, unit: '%', angle: 205, _div: 0.5 },
  { entity: 'person.alex', name: 'Alex', category: 'PRESENCE', angle: 115, state_map: { home: 0, work: 0.3, not_home: 1 }, divergence_threshold: 0.5, _state: 'work', _div: 0.5 },
];

// Texts of this page in each card language; the settings labels and tooltips come from the card
const PAGE_TEXT = {

    intro: 'Cambia los ajustes, mueve los valores simulados y copia el YAML en una tarjeta manual de tu panel. Toca el centro o una etiqueta para ver su acción.',
    install: 'Instalación', hidePanel: 'Ocultar panel', showPanel: 'Mostrar panel', language: 'Idioma',

    simValue: 'Valor simulado', simState: 'Estado simulado', numericValue: 'Valor numérico',
    divTip: 'Valor de sensor simulado solo para esta página, de 0 (base) a 1 (crítico). No forma parte de la configuración.',
    stateTip: 'Estado simulado solo para esta página. Un estado de la asignación usa su divergencia; "Valor numérico" simula un número entre el valor base y el crítico.',
    simulateAll: 'Simular todo:', calm: 'Tranquilo', critical: 'Crítico', random: 'Aleatorio',
    yourConfig: 'Tu configuración', debug: 'Depuración', copyYaml: 'Copiar YAML', shareLink: 'Compartir', reset: 'Restablecer',
    shareTitle: 'Copia un enlace que abre esta página con tus ajustes', resetTitle: 'Volver a los valores predeterminados de la tarjeta y a las entidades de ejemplo',
    copied: 'Copiado', copyFailed: 'Error al copiar', heightNote: 'Aquí la vista previa siempre llena la ventana.',
    tap: 'Toque', hold: 'Pulsación larga', on: 'en {entity}',
    actions: { '': 'Predeterminada', none: 'Ninguna', 'more-info': 'Más información', toggle: 'Alternar', navigate: 'Ir a una vista', url: 'Abrir una URL', popup: 'Ventana de browser_mod' }
  },
  nl: {
    intro: 'Wijzig de instellingen, verschuif de gesimuleerde waarden en kopieer dan de YAML naar een handmatige kaart in je dashboard. Tik op het midden of een label om de actie te zien.',
    install: 'Installatie', hidePanel: 'Paneel verbergen', showPanel: 'Paneel tonen', language: 'Taal',
    simDark: 'Donkere modus van Home Assistant simuleren', simDarkTip: 'Alleen deze pagina: de donkere modus die thema Auto volgt.',
    simValue: 'Gesimuleerde waarde', simState: 'Gesimuleerde status', numericValue: 'Numerieke waarde',
    divTip: 'Gesimuleerde sensorwaarde alleen voor deze pagina, van 0 (basis) tot 1 (kritiek). Deze hoort niet bij de configuratie.',
    stateTip: 'Gesimuleerde status alleen voor deze pagina. Een status uit de toewijzing gebruikt zijn divergentie; "Numerieke waarde" simuleert een getal tussen basiswaarde en kritieke waarde.',
    simulateAll: 'Alles simuleren:', calm: 'Rustig', critical: 'Kritiek', random: 'Willekeurig',
    yourConfig: 'Jouw configuratie', debug: 'Debug', copyYaml: 'YAML kopiëren', shareLink: 'Deellink', reset: 'Herstellen',
    shareTitle: 'Kopieert een link die deze pagina met jouw instellingen opent', resetTitle: 'Terug naar de standaardwaarden van de kaart en de voorbeeldentiteiten',
    copied: 'Gekopieerd', copyFailed: 'Kopiëren mislukt', heightNote: 'Het voorbeeld hier vult altijd het venster.',
    tap: 'Tik', hold: 'Vasthouden', on: 'op {entity}',
    actions: { '': 'Standaard', none: 'Geen', 'more-info': 'Meer info', toggle: 'Schakelen', navigate: 'Naar een weergave', url: 'URL openen', popup: 'browser_mod-pop-up' }
  },
  it: {
    intro: "Modifica le impostazioni, sposta i valori simulati e poi copia lo YAML in una scheda manuale della tua dashboard. Tocca il centro o un'etichetta per vederne l'azione.",
    install: 'Installazione', hidePanel: 'Nascondi pannello', showPanel: 'Mostra pannello', language: 'Lingua',
    simDark: 'Simula la modalità scura di Home Assistant', simDarkTip: 'Solo questa pagina: la modalità scura che segue il tema Auto.',
    simValue: 'Valore simulato', simState: 'Stato simulato', numericValue: 'Valore numerico',
    divTip: 'Valore del sensore simulato solo per questa pagina, da 0 (base) a 1 (critico). Non fa parte della configurazione.',
    stateTip: 'Stato simulato solo per questa pagina. Uno stato della mappa usa la sua divergenza; "Valore numerico" simula un numero tra valore base e valore critico.',
    simulateAll: 'Simula tutto:', calm: 'Calmo', critical: 'Critico', random: 'Casuale',
    yourConfig: 'La tua configurazione', debug: 'Debug', copyYaml: 'Copia YAML', shareLink: 'Condividi', reset: 'Ripristina',
    shareTitle: 'Copia un link che apre questa pagina con le tue impostazioni', resetTitle: 'Torna ai valori predefiniti della scheda e alle entità di esempio',

  }
};
let P = PAGE_TEXT.en;
const fillPage = (text, vars) => text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
// The settings list of the card (labels, ranges, tooltips), so this page matches the visual editor
let SETTINGS = { sections: [], card: [], entity: [] }, CARD_KEYS = [], ENT_KEYS = [];
let DEFAULTS = {}, state = {}, ENTS = [], cards = [], statsEl;
const isSet = v => v !== null && v !== undefined && v !== '';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const roundTo = (v, step) => { const d = Math.max(0, -Math.floor(Math.log10(step))); return Number(v.toFixed(Math.min(d, 10))); };

// ---- share link (#cfg=base64url JSON) ----
function encodeCfg(obj) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeCfg(text) {
  try {
    const b = text.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
  } catch (err) { return null; }
}
function loadShared() {
  const m = location.hash.match(/cfg=([^&]+)/);
  if (m) return decodeCfg(m[1]);
  try { return q.get('cfg') ? JSON.parse(q.get('cfg')) : null; } catch (err) { return null; }
}

// ---- YAML ----
function yScalar(v) {
  if (v === null || v === undefined) return 'null';
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  const s = String(v);
  const plain = /^[A-Za-z_][^\n"'#\\]*$/.test(s) && !/: |:$|\s$/.test(s) && !/^(true|false|null|yes|no|on|off|y|n)$/i.test(s);
  return plain ? s : JSON.stringify(s);
}
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function toYaml(v, ind = '') {
  if (Array.isArray(v)) {
    return v.map(item => (isObj(item) && Object.keys(item).length
      ? ind + '- ' + toYaml(item, ind + '  ').slice(ind.length + 2)
      : ind + '- ' + yScalar(item))).join('\n');
  }
  return Object.entries(v).map(([k, val]) => {
    const nested = (isObj(val) && Object.keys(val).length) || (Array.isArray(val) && val.length);
    if (nested) return `${ind}${yScalar(k)}:\n${toYaml(val, ind + '  ')}`;
    return `${ind}${yScalar(k)}: ${isObj(val) ? '{}' : Array.isArray(val) ? '[]' : yScalar(val)}`;
  }).join('\n');
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// The config a user copies: card defaults and empty fields left out
function exportConfig() {
  const out = { type: 'custom:lovelace-rehoboam' };
  CARD_KEYS.forEach(k => {
    const v = state[k];
    if (!isSet(v) || (k in DEFAULTS && same(v, DEFAULTS[k]))) return;
    out[k] = v;
  });
  out.entities = ENTS.map(e => {
    const o = {};
    ENT_KEYS.forEach(k => { if ((isSet(e[k]) && !(k === 'always_visible' && !e[k])) || k === 'entity') o[k] = e[k] ?? ''; });
    return o;
  });
  return out;
}

// ---- preview cards and fake Home Assistant ----
function cardConfig(i) {
  const c = { ...exportConfig() };
  if (grid) Object.assign(c, PRESETS[i]);
  else if (one !== null) Object.assign(c, PRESETS[Number(one)] || {});
  c.height = grid ? '353px' : '100%';
  return c;
}
function hassStates() {
  const states = {};
  ENTS.forEach(e => {
    if (!e.entity) return;
    const base = isSet(e.baseline) ? Number(e.baseline) : 0;
    const crit = isSet(e.critical) ? Number(e.critical) : 100;
    const mappedState = hasStateMap(e) && isSet(e._state) && e._state in e.state_map;
    const value = mappedState ? e._state : String(roundTo(base + e._div * (crit - base), 0.1));
    states[e.entity] = { state: value, attributes: { unit_of_measurement: mappedState ? '' : e.unit || '', friendly_name: e.name || e.entity } };
  });
  // Language and a simple stand-in for Home Assistant's state formatting
  const lang = state._lang || 'en';
  const formatEntityState = obj => {
    const n = Number(obj.state);
    if (obj.state === '' || !Number.isFinite(n)) return obj.state;
    const decimals = Math.min(6, (String(obj.state).split('.')[1] || '').length);
    const unit = obj.attributes.unit_of_measurement;
    return new Intl.NumberFormat(lang, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n) + (unit ? ' ' + unit : '');
  };

// ---- controls ----

// Slider and number box for one option. With nullable, an empty box means "not set".

// Action picker for the common actions. The value is the action object of the YAML.
const ACTIONS = ['', 'none', 'more-info', 'toggle', 'navigate', 'url', 'popup'];

}
function actionParam(a, kind) {

}
function actionField(parent, label, key, { obj = state, tip } = {}) {

// ---- entities ----
function thresholdBounds(e) {
  // With a state map the entity thresholds are divergence values (0-1)
  const mapped = hasStateMap(e);
  const base = mapped ? 0 : isSet(e.baseline) ? Number(e.baseline) : 0;
  const crit = mapped ? 1 : isSet(e.critical) ? Number(e.critical) : 100;
  const lo = Math.min(base, crit), hi = Math.max(base, crit);
  const span = hi - lo;
  const step = span > 0 ? Math.pow(10, Math.floor(Math.log10(span / 100))) : 1;
  const div = state.divergence_threshold ?? 0.15;
  const mon = state.monitoring_threshold ?? div;
  return { lo, hi, step, divAt: roundTo(base + div * (crit - base), step), monAt: roundTo(base + mon * (crit - base), step) };
}
function autoAngle(idx) {
  const unangled = ENTS.map(e => !isSet(e.angle));
  const count = unangled.filter(Boolean).length;
  const before = unangled.slice(0, idx).filter(Boolean).length;
  return Math.round((22.5 + before * 360 / Math.max(1, count)) % 360);

let entList, divRows = [], thresholdRows = [];
// Simulated sensor: a state from the state map, or a value between baseline and critical
function simField(box, e) {
  if (hasStateMap(e)) {
    const row = el('div', 'row');
    row.appendChild(labelEl(P.simState, P.stateTip));
    const sel = el('select');
    [...Object.keys(e.state_map), ''].forEach(st => {
      const o = el('option', '', st ? `${st} (${e.state_map[st]})` : P.numericValue); o.value = st; sel.appendChild(o);
    });
    if (!isSet(e._state) || !(e._state in e.state_map)) e._state = e._state === '' ? '' : Object.keys(e.state_map)[0];
    sel.value = e._state;
    sel.onchange = () => { e._state = sel.value; renderEntities(); pushStates(); };
    row.appendChild(sel);
    box.appendChild(row);
    if (e._state !== '') return;
  }
  divRows.push(num(box, P.simValue, '_div', 0, 1, 0.01, { obj: e, onChange: pushStates, tip: P.divTip }));
}
// State map rows: state name, divergence slider and number box, remove button
function mapField(parent, st, e) {
  const row = el('div', 'row');
  row.appendChild(labelEl(st.label, st.tip));
  const list = el('div');
  const save = rerender => {
    const map = {};
    list.querySelectorAll('.maprow').forEach(r => {
      const name = r.querySelector('input[type=text]').value.trim();
      const v = Number(r.querySelector('input[type=number]').value);
      if (name) map[name] = Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : 0;
    });
    const had = hasStateMap(e);
    e.state_map = Object.keys(map).length ? map : null;
    if (rerender || had !== hasStateMap(e)) renderEntities();
    apply();
  };
  Object.entries(e.state_map || {}).forEach(([name, v]) => {
    const r = el('div', 'ctl maprow');
    const nameBox = el('input'); nameBox.type = 'text'; nameBox.value = name; nameBox.placeholder = SETTINGS.ui.state; nameBox.setAttribute('aria-label', SETTINGS.ui.state);
    const rng = el('input'); rng.type = 'range'; rng.min = 0; rng.max = 1; rng.step = 0.05; rng.value = v;
    const box = el('input'); box.type = 'number'; box.min = 0; box.max = 1; box.step = 0.05; box.value = v;
    const divLabel = fillPage(SETTINGS.ui.divergenceOf, { state: name });
    rng.setAttribute('aria-label', divLabel); box.setAttribute('aria-label', divLabel);
    const del = el('button', 'btn danger', '×'); del.type = 'button'; del.setAttribute('aria-label', fillPage(SETTINGS.ui.removeState, { state: name }));
    rng.oninput = () => { box.value = rng.value; save(false); };
    box.onchange = () => { rng.value = box.value; save(false); };

    r.append(nameBox, rng, box, del);

}
function renderEntities() {
  entList.textContent = '';
  divRows = []; thresholdRows = [];
  ENTS.forEach((e, idx) => {
    const box = el('details', 'ent');
    box.open = !!e._open;
    box.ontoggle = () => { e._open = box.open; };
    const sum = el('summary');
    const title = el('span');
    const setTitle = () => { title.textContent = `#${idx + 1} ${e.category || SETTINGS.text.category} · ${e.name || e.entity || SETTINGS.ui.unconfigured}`; };
    setTitle();
    const rm = el('button', 'btn danger', SETTINGS.ui.remove); rm.type = 'button';
    rm.onclick = ev => { ev.preventDefault(); ENTS.splice(idx, 1); renderEntities(); apply(); };
    sum.append(title, rm);
    box.appendChild(sum);
    const changed = () => { setTitle(); apply(); };
    const bounds = () => { refreshThresholds(); changed(); };
    simField(box, e);
    const b = thresholdBounds(e);
    const thresholds = [];
    const pairs = { name: 'category', baseline: 'critical' };
    let pairBox = null;
    SETTINGS.entity.forEach(st => {
      let parent = box;
      if (pairs[st.key]) { pairBox = el('div', 'pair'); box.appendChild(pairBox); parent = pairBox; }
      else if (pairBox && Object.values(pairs).includes(st.key)) { parent = pairBox; pairBox = null; }

        case 'entity': case 'text': text(parent, st.label, st.key, st.placeholder || '', { ...opts, onChange: changed }); break;
        case 'plain': plainNum(parent, st.label, st.key, { ...opts, onChange: bounds }); break;
        case 'number': num(parent, st.label, st.key, st.min, st.max, st.step, { ...opts, nullable: st.nullable, placeholder: st.placeholder || '', unsetAt: st.key === 'angle' ? autoAngle(idx) : st.min }); break;
        case 'threshold': thresholds.push(num(parent, hasStateMap(e) ? st.mapLabel : st.label, st.key, b.lo, b.hi, b.step, { ...opts, nullable: true, placeholder: st.placeholder || '', unsetAt: st.key === 'divergence_threshold' ? b.divAt : b.monAt })); break;

}
// The card thresholds move the resting point of the entity threshold sliders

// ---- config output ----
let yamlBox;
function renderYaml() { if (yamlBox) yamlBox.textContent = toYaml(exportConfig()); }
function flash(btn, msg, ok) {
  if (btn._flash) clearTimeout(btn._flash); else btn._label = btn.textContent;
  btn.textContent = msg;
  btn.classList.toggle('done', ok);
  btn._flash = setTimeout(() => { btn.textContent = btn._label; btn.classList.remove('done'); btn._flash = null; }, 1300);
}
async function copyText(textValue, btn) {
  try {
    await navigator.clipboard.writeText(textValue);
    flash(btn, P.copied, true);
  } catch (err) {
    // Fallback for browsers without the clipboard API or without permission
    const area = el('textarea'); area.value = textValue;
    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(area); area.select();
    const ok = document.execCommand('copy');
    area.remove();
    flash(btn, ok ? P.copied : P.copyFailed, ok);
  }
}
function shareLink() {
  const cfg = exportConfig();
  cfg.entities = cfg.entities.map((o, i) => ({ ...o, _div: ENTS[i]._div, ...(isSet(ENTS[i]._state) ? { _state: ENTS[i]._state } : {}) }));
  cfg._lang = state._lang;
  return location.origin + location.pathname + location.search + '#cfg=' + encodeCfg(cfg);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function entitySection(panel) {
  heading(panel, SETTINGS.ui.entities);
  entList = el('div'); panel.appendChild(entList);
  renderEntities();
  const addBtn = el('button', 'btn add', SETTINGS.ui.addEntity); addBtn.type = 'button';
  addBtn.onclick = () => {
    const fresh = { entity: '', _div: 0.5, _open: true };
    SETTINGS.entity.forEach(st => { if (st.default !== undefined) fresh[st.key] = st.default; });
    ENTS.push(fresh); renderEntities(); apply();
  };
  panel.appendChild(addBtn);
  const sim = el('div', 'sim');
  sim.appendChild(el('span', '', P.simulateAll));
  // Entities with a state map pick the state with the lowest, highest or a random divergence
  const pickState = (e, how) => {
    const entries = Object.entries(e.state_map).sort((a, b) => a[1] - b[1]);
    e._state = (how === 'min' ? entries[0] : how === 'max' ? entries[entries.length - 1] : entries[Math.floor(Math.random() * entries.length)])[0];
  };
  const simAll = (how, div) => ENTS.forEach(e => { if (hasStateMap(e)) pickState(e, how); else e._div = div(); });
  [[P.calm, () => simAll('min', () => 0)], [P.critical, () => simAll('max', () => 1)], [P.random, () => simAll('random', Math.random)]].forEach(([label, fn]) => {
    const b = el('button', 'btn', label); b.type = 'button';
    b.onclick = () => { fn(); renderEntities(); pushStates(); };
    sim.appendChild(b);
  });
  panel.appendChild(sim);
}

// ---- build the page once the card script is loaded ----
function buildPanel() {
  const panel = document.getElementById('panel');
  panel.textContent = '';
  const intro = el('p', 'intro', P.intro);
  panel.appendChild(intro);

  const onThreshold = () => { refreshThresholds(); apply(); };
  SETTINGS.sections.forEach(sec => {
    heading(panel, sec.title);
    SETTINGS.card.filter(st => st.section === sec.id).forEach(st => {
      const opts = { tip: st.tip };
      switch (st.type) {
        case 'select':
          (st.options.length > 3 ? dropdown : seg)(panel, st.label, st.options, st.key, opts);
          if (st.key === 'theme_mode') check(panel, P.simDark, '_ha_dark', { tip: P.simDarkTip });
          break;
        case 'number':
          num(panel, st.label, st.key, st.min, st.max, st.step, {
            ...opts, nullable: st.nullable, placeholder: st.placeholder || '', unsetAt: settingUnsetAt(st, state),
            onChange: /threshold/.test(st.key) ? onThreshold : apply

          break;
        case 'text': case 'entity':
          text(panel, st.label, st.key, st.placeholder || '', st.key === 'height' ? { tip: `${st.tip} ${P.heightNote}` } : opts);
          break;
        case 'bool': check(panel, st.label, st.key, opts); break;
        case 'action': actionField(panel, st.label, st.key, opts); break;
      }
    });
  });
  entitySection(panel);

  heading(panel, P.yourConfig);
  yamlBox = el('pre'); yamlBox.id = 'yaml'; panel.appendChild(yamlBox);
  const dbg = el('details'); dbg.appendChild(el('summary', '', P.debug));
  const stats = el('div', 'stats'); dbg.appendChild(stats); panel.appendChild(dbg);
  const bar = el('div', 'actions');
  const copyBtn = el('button', 'btn primary', P.copyYaml); copyBtn.type = 'button';
  copyBtn.onclick = () => copyText(toYaml(exportConfig()) + '\n', copyBtn);
  const linkBtn = el('button', 'btn', P.shareLink); linkBtn.type = 'button';
  linkBtn.title = P.shareTitle;
  linkBtn.onclick = () => { const url = shareLink(); history.replaceState(null, '', url); copyText(url, linkBtn); };
  const resetBtn = el('button', 'btn ghost', P.reset); resetBtn.type = 'button';
  resetBtn.title = P.resetTitle;
  resetBtn.onclick = () => { location.href = location.pathname + location.search; };
  bar.append(copyBtn, linkBtn, resetBtn);
  panel.appendChild(bar);

}

// Page language: the share link, then ?lang=, then the browser language
function setLanguage(code) {
  const lang = normLang(code);
  state._lang = lang;
  SETTINGS = customElements.get('lovelace-rehoboam-editor').settingsFor(lang);
  P = PAGE_TEXT[lang] || PAGE_TEXT.en;
  document.documentElement.lang = lang;
  document.getElementById('install-link').textContent = P.install;
  document.getElementById('lang').setAttribute('aria-label', P.language);
  document.getElementById('toggle').textContent = document.body.classList.contains('nopanel') ? P.showPanel : P.hidePanel;
}

function init() {
  SETTINGS = customElements.get('lovelace-rehoboam-editor').settings;
  CARD_KEYS = SETTINGS.card.map(st => st.key);
  ENT_KEYS = SETTINGS.entity.map(st => st.key);
  // Card defaults, read from the card itself so this page never drifts from it
  const probe = document.createElement('lovelace-rehoboam');
  probe.setConfig({ entities: [] });
  DEFAULTS = { ...probe._config, font_family: null, height: null };
  state = { _ha_dark: true };
  CARD_KEYS.forEach(k => { state[k] = k in DEFAULTS ? DEFAULTS[k] : null; });
  ENTS = DEMO_ENTS.map(e => ({ ...e }));
  const shared = loadShared();
  if (shared) {
    CARD_KEYS.forEach(k => { if (k in shared) state[k] = shared[k]; });
    if (Array.isArray(shared.entities)) ENTS = shared.entities.map(e => ({ _div: 0.5, ...(typeof e === 'string' ? { entity: e } : e) }));
  }
  document.getElementById('ver').textContent = typeof CARD_VERSION !== 'undefined' ? 'v' + CARD_VERSION : '';
  setLanguage((shared && shared._lang) || q.get('lang') || navigator.language);
  const langSel = document.getElementById('lang');
  SETTINGS.languages.forEach(([code, name]) => { const o = el('option', '', name); o.value = code; langSel.appendChild(o); });
  langSel.value = state._lang;
  langSel.onchange = () => { setLanguage(langSel.value); statsEl = buildPanel(); apply(); };
  statsEl = buildPanel();

  const cells = document.getElementById('cells');
  cells.className = grid ? 'grid' : 'single';
  if (!grid) document.getElementById('c' + (one ?? '0')).classList.add('sel');
  cards = PRESETS.map((_, i) => {
    if (!grid && String(i) !== (one ?? '0')) return null;
    const card = document.createElement('lovelace-rehoboam');
    card.setConfig(cardConfig(i));
    document.getElementById('c' + i).appendChild(card);
    card.hass = hassStates();
    const orig = card._updatePolarLUT.bind(card);
    card._lutStats = { n: 0, ms: 0 };
    card._updatePolarLUT = t => { const t0 = performance.now(); orig(t); card._lutStats.ms += performance.now() - t0; card._lutStats.n++; };
    return card;
  });
  window.cards = cards;

  // No Home Assistant here: show what the action would do
  window.addEventListener('hass-action', e => {
    const { config, action } = e.detail;
    const a = config[`${action}_action`] || {};
    let what = a.action || 'none';
    if (a.browser_mod) what = `${a.browser_mod.service} popup`;
    else if (a.navigation_path) what += ` ${a.navigation_path}`;
    else if (a.url_path) what += ` ${a.url_path}`;
    const where = config.entity ? ' ' + fillPage(P.on, { entity: config.entity }) : '';
    window.lastAction = `${action}: ${what}${where}`;
    toast(`${action === 'hold' ? P.hold : P.tap}${where}: ${what}`);
  });
  setInterval(() => {
    const c = cards.find(Boolean); if (!c) return;
    const st = c._lutStats;
    statsEl.textContent = `frames/s: ${st.n}  LUT: ${(st.ms / Math.max(1, st.n)).toFixed(3)} ms\ncanvas: ${c._canvas.width}x${c._canvas.height}\nlast action: ${window.lastAction || '-'}`;
    st.n = 0; st.ms = 0;
  }, 1000);
}

document.getElementById('toggle').onclick = e => {
  const hidden = document.body.classList.toggle('nopanel');
  e.currentTarget.textContent = hidden ? P.showPanel : P.hidePanel;
  cards.forEach(c => c && c._onResize());
};
const s = document.createElement('script');
s.src = scriptName + '.js?' + Date.now();
s.onload = init;
document.head.appendChild(s);
